name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    name: Análisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formato
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Análisis estático
        run: flutter analyze

      - name: Contraste de la paleta (WCAG AA)
        run: dart run tool/auditar_contraste.dart

      - name: Tests
        run: flutter test

  build-web:
    name: Compilar web
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - run: flutter pub get

      # Las claves reales se guardan en Settings → Secrets and variables →
      # Actions. Ya no hay valores por defecto en el código (SEC-08): si los
      # secrets faltan, el artefacto compila igual —sirve para validar que el
      # código compila— pero al abrirlo aborta diciendo que le falta el
      # backend, en vez de arrancar apuntando a un servidor que no es.
      - name: Compilar web (WebAssembly)
        run: |
          flutter build web --wasm --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: glint-web
          path: build/web/
          retention-days: 7

  build-apk:
    name: Compilar APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Compilar APK
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: glint-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

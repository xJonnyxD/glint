# Gateway interno: expone GoTrue y PostgREST bajo los prefijos que espera
# supabase_flutter.

# ── Rate limiting de autenticación (SEC-02) ─────────────────────────────────
# Frena la fuerza bruta de login y la enumeración de usuarios. La IP real la
# pone Cloudflare en CF-Connecting-IP; nginx solo es alcanzable vía Traefik en
# la red interna, así que confiamos esa cabecera. 30 peticiones/min por IP con
# ráfaga de 20 es holgado para uso legítimo (incluso IPs compartidas de móvil)
# y a la vez detiene el abuso automatizado.
set_real_ip_from 0.0.0.0/0;
real_ip_header CF-Connecting-IP;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_status 429;

server {
  listen 80;
  client_max_body_size 10m;

  # ── Resolución de los upstreams en CADA petición ──────────────────────────
  # Con `proxy_pass http://auth:9999/` nginx resuelve el nombre UNA sola vez, al
  # arrancar, y se queda con esa IP para siempre. Cada vez que Docker recreaba
  # un contenedor (un `up -d`, un reinicio del host) la IP cambiaba y el gateway
  # seguía llamando a la vieja: 502 en /auth/v1 y nadie podía entrar, mientras
  # la web y /rest/v1 seguían aparentemente bien. Pasó dos veces.
  #
  # Poniendo el destino en una variable, nginx obliga a resolver por DNS en cada
  # petición; 127.0.0.11 es el resolver interno de Docker. `valid=10s` acota
  # cuánto puede quedarse una IP obsoleta.
  #
  # Al usar variables, nginx deja de recortar solo el prefijo del location (la
  # magia de la barra final de proxy_pass), así que el recorte va explícito en
  # cada `rewrite`.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Autenticación (login, registro, refresh de sesión)
  location /auth/v1/ {
    limit_req zone=auth_limit burst=20 nodelay;
    set $up_auth "auth:9999";
    rewrite ^/auth/v1/(.*)$ /$1 break;
    proxy_pass http://$up_auth;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Datos: es la ruta que usa supabase_flutter para .from('habits') etc.
  # PostgREST espera la apikey como Authorization; supabase_flutter manda
  # ambas cabeceras, así que basta con pasarlas tal cual.
  location /rest/v1/ {
    set $up_rest "rest:3000";
    rewrite ^/rest/v1/(.*)$ /$1 break;
    proxy_pass http://$up_rest;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # PostgREST necesita esta cabecera para respetar el rol del JWT
    proxy_set_header Accept-Profile    public;
    proxy_set_header Content-Profile   public;
  }

  # Realtime (websockets): push en vivo de los cambios de la BD.
  # supabase_flutter conecta a wss://glint.yanes.xyz/realtime/v1/websocket.
  # El rewrite mapea /realtime/v1/websocket -> /socket/websocket.
  # El Host se reescribe a "realtime-dev.*": Realtime es multi-tenant y resuelve
  # el tenant por el primer segmento del Host, que debe coincidir con el que
  # siembra SEED_SELF_HOST ("realtime-dev").
  location /realtime/v1/ {
    set $up_realtime "realtime:4000";
    rewrite ^/realtime/v1/(.*)$ /socket/$1 break;
    proxy_pass http://$up_realtime;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "Upgrade";
    proxy_set_header Host              "realtime-dev.glint";
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Archivos del usuario (fotos de perfil). supabase_flutter llama a
  # /storage/v1/object/... con el JWT de la sesión; storage-api valida el token
  # con el mismo JWT_SECRET y aplica la RLS de storage.objects.
  #
  # client_max_body_size va aquí y no solo en el server: el límite de verdad lo
  # pone storage-api con FILE_SIZE_LIMIT (5 MB), pero si nginx corta antes, el
  # cliente recibe un 413 de nginx sin cuerpo JSON y el error es indescifrable.
  location /storage/v1/ {
    set $up_storage "storage:5000";
    rewrite ^/storage/v1/(.*)$ /$1 break;
    proxy_pass http://$up_storage;
    client_max_body_size 6m;
    proxy_request_buffering off;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}

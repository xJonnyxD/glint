# Gateway interno: expone GoTrue y PostgREST bajo los prefijos que espera
# supabase_flutter. El proxy_pass con barra final recorta el prefijo del location.

# ── Rate limiting de autenticación (SEC-02) ─────────────────────────────────
# Frena la fuerza bruta de login y la enumeración de usuarios. La IP real la
# pone Cloudflare en CF-Connecting-IP; nginx solo es alcanzable vía Traefik en
# la red interna, así que confiamos esa cabecera. 30 peticiones/min por IP con
# ráfaga de 20 es holgado para uso legítimo (incluso IPs compartidas de móvil)
# y a la vez detiene el abuso automatizado.
set_real_ip_from 0.0.0.0/0;
real_ip_header CF-Connecting-IP;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=30r/m;
limit_req_status 429;

server {
  listen 80;
  client_max_body_size 10m;

  # Autenticación (login, registro, refresh de sesión)
  location /auth/v1/ {
    limit_req zone=auth_limit burst=20 nodelay;
    proxy_pass http://auth:9999/;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Datos: es la ruta que usa supabase_flutter para .from('habits') etc.
  # PostgREST espera la apikey como Authorization; supabase_flutter manda
  # ambas cabeceras, así que basta con pasarlas tal cual.
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    # PostgREST necesita esta cabecera para respetar el rol del JWT
    proxy_set_header Accept-Profile    public;
    proxy_set_header Content-Profile   public;
  }

  # Realtime (websockets): push en vivo de los cambios de la BD.
  # supabase_flutter conecta a wss://glint.yanes.xyz/realtime/v1/websocket.
  # El proxy_pass con /socket/ mapea /realtime/v1/websocket -> /socket/websocket.
  # El Host se reescribe a "realtime-dev.*": Realtime es multi-tenant y resuelve
  # el tenant por el primer segmento del Host, que debe coincidir con el que
  # siembra SEED_SELF_HOST ("realtime-dev").
  location /realtime/v1/ {
    proxy_pass http://realtime:4000/socket/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "Upgrade";
    proxy_set_header Host              "realtime-dev.glint";
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }
}

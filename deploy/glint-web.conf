# Sirve tres cosas bajo el mismo dominio:
#   /            → la web pública (información, login, descargas)
#   /app/        → la app Flutter compilada a WebAssembly
#   /descargas/  → el APK de Android
#
# TLS lo termina Cloudflare, así que aquí solo hablamos HTTP plano con Traefik.
#
# ── Sobre la caché ──────────────────────────────────────────────────────────
# Flutter NO pone hash de contenido en los nombres de sus archivos: cada build
# genera otra vez main.dart.wasm, flutter_bootstrap.js, etc. con el mismo
# nombre. Marcarlos `immutable` deja a los usuarios clavados para siempre en la
# primera versión que cargaron: los despliegues no les llegan nunca.
#
# Por eso todo /app/ va con `no-cache`, que NO significa "no guardar" sino
# "revalidar antes de usar": el navegador conserva el archivo y nginx le
# responde 304 (unos cientos de bytes) mientras no cambie. Se mantiene rápido
# y los despliegues se ven de inmediato.
#
# ── Sobre `types` ───────────────────────────────────────────────────────────
# No declarar un bloque `types` a nivel de server: en nginx eso *reemplaza* el
# mapa MIME heredado en lugar de ampliarlo, y todo lo demás (empezando por
# index.html) pasaría a servirse como application/octet-stream. El mime.types
# de nginx ≥1.21 ya mapea .wasm correctamente.
#
# ── Sobre `add_header` ──────────────────────────────────────────────────────
# nginx NO hereda las cabeceras dentro de un location que declara las suyas,
# por eso se repiten en cada bloque.

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  add_header Cross-Origin-Opener-Policy   same-origin  always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header X-Content-Type-Options       nosniff      always;
  add_header Referrer-Policy              strict-origin-when-cross-origin always;

  # ── La app Flutter ────────────────────────────────────────────────────────
  # main.dart.mjs es el módulo ES que arranca el WebAssembly y nginx no conoce
  # la extensión .mjs: sin un tipo JavaScript el navegador rechaza el módulo y
  # la app no carga. `default_type` solo aplica a extensiones sin mapeo, así
  # que .wasm y .js conservan el suyo.
  location ^~ /app/ {
    default_type text/javascript;
    add_header Cross-Origin-Opener-Policy   same-origin  always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options       nosniff      always;
    # Anti-clickjacking + HSTS. No ponemos CSP restrictiva aquí: Flutter WASM
    # necesita wasm-eval y workers blob, y una CSP mal ajustada rompe la app.
    add_header X-Frame-Options              DENY         always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "no-cache" always;
    # Fallback al index de la app para que las rutas de GoRouter aguanten
    # una recarga de página.
    try_files $uri $uri/ /app/index.html;
  }

  # ── Descargas (APK) ───────────────────────────────────────────────────────
  location ^~ /descargas/ {
    add_header Cross-Origin-Opener-Policy   same-origin  always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options       nosniff      always;
    add_header X-Frame-Options              DENY         always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control "public, max-age=3600" always;
    # Sin esto Android no reconoce el archivo como instalable. Acotado a este
    # location, donde solo hay APKs.
    types { application/vnd.android.package-archive apk; }
    default_type application/octet-stream;
    try_files $uri =404;
  }

  # ── Web pública (landing + panel /admin/) ─────────────────────────────────
  # CSP estricta aquí porque son HTML estáticos (no Flutter). Clave: `connect-src
  # 'self'` impide exfiltrar el token de admin a un dominio externo aunque
  # hubiera XSS; `frame-ancestors 'none'` + X-Frame-Options bloquean clickjacking.
  # `'unsafe-inline'` es necesario por los <style>/<script> inline del panel.
  location / {
    add_header Cross-Origin-Opener-Policy   same-origin  always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header X-Content-Type-Options       nosniff      always;
    add_header X-Frame-Options              DENY         always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}

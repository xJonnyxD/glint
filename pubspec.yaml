name: glint
description: "Glint - Super-app de productividad, hábitos y finanzas personales."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- State Management ---
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # --- Navegación ---
  go_router: ^15.1.2

  # --- Backend / Auth ---
  # El login con Google usa el OAuth web de Supabase (signInWithOAuth), así
  # que no hacen falta los paquetes nativos google_sign_in / sign_in_with_apple.
  supabase_flutter: ^2.9.1

  # --- Base de datos local ---
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.24  # bundlea libsqlite3.so en el APK (necesario para Drift)
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  path: ^1.9.1

  # --- Seguridad ---
  local_auth: ^2.3.0

  # --- DI ---
  get_it: ^8.0.3

  # --- Red ---
  connectivity_plus: ^6.1.4

  # --- Utilidades ---
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

  # --- UI / Gráficos ---
  fl_chart: ^1.0.0
  table_calendar: ^3.2.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  image_picker: ^1.1.2

  # --- Backup / Exportación ---
  csv: ^6.0.0
  share_plus: ^10.1.4
  file_picker: ^8.1.6  # elegir el archivo al restaurar una copia
  pdf: ^3.11.1         # generar reportes financieros en PDF

  # --- Notificaciones / Background ---
  awesome_notifications: ^0.10.1

  # --- Interfaz ---
  google_fonts: ^8.2.1
  material_symbols_icons: ^4.2960.0
  skeletonizer: ^2.1.3
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # --- Generadores de código ---
  build_runner: ^2.4.14
  drift_dev: ^2.23.1

  # --- Testing ---
  mocktail: ^1.0.4
  # bloc_test se agrega cuando se implementen los primeros BLoCs
  # Para pre-sembrar una base en un esquema viejo en los tests de migración
  # (ya viene como dependencia transitiva de drift).
  sqlite3: ^2.4.1

  # --- Ícono de la app ---
  flutter_launcher_icons: ^0.14.3

  # --- Splash nativo (pantalla de arranque con logo) ---
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
